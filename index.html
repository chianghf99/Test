<div class="mt-8 border-t border-gray-100 dark:border-gray-700 pt-6">
    <div class="flex justify-between items-center mb-4">
        <h4 class="text-sm font-bold dark:text-white"><i class="fa-solid fa-clock-rotate-left mr-2"></i>借還款明細</h4>
        <div class="flex gap-2">
            <input type="date" v-model="loanLogStartDate" class="zen-input text-xs py-1 w-32">
            <span class="text-gray-400">~</span>
            <input type="date" v-model="loanLogEndDate" class="zen-input text-xs py-1 w-32">
        </div>
    </div>
    
    <div class="overflow-x-auto">
        <table class="w-full text-sm text-left">
            <thead class="bg-gray-50 dark:bg-gray-800 text-gray-500 uppercase font-medium">
                <tr>
                    <th class="px-4 py-2 sort-header" @click="sortLoanLog('date')">日期 <i class="fa-solid fa-sort ml-1"></i></th>
                    <th class="px-4 py-2">類別</th>
                    <th class="px-4 py-2">備註/帳戶</th>
                    <th class="px-4 py-2 text-right">金額</th>
                    <th class="px-4 py-2 text-center">操作</th>
                </tr>
            </thead>
            <tbody class="divide-y divide-gray-100 dark:divide-gray-700">
                <tr v-for="tx in sortedLoanLogs" :key="tx.id" class="hover:bg-gray-50 dark:hover:bg-gray-800">
                    <td class="px-4 py-3 text-gray-500">{{ tx.date }}</td>
                    <td class="px-4 py-3">
                        <span class="tag" :class="tx.type==='borrow' ? 'tag-buy' : 'tag-sell'">{{ getTypeName(tx.type) }}</span>
                    </td>
                    <td class="px-4 py-3">
                        <div class="font-bold">{{ tx.name }}</div> </td>
                    <td class="px-4 py-3 text-right font-bold" :class="tx.type==='borrow'?'text-up':'text-down'">
                        {{ tx.type==='borrow'?'+':'-' }}{{ formatCurrency(tx.totalAmount, 'TWD') }}
                    </td>
                    <td class="px-4 py-3 text-center">
                        <button @click="deleteTransaction(tx)" class="text-gray-400 hover:text-red-500"><i class="fa-solid fa-trash-can"></i></button>
                    </td>
                </tr>
            </tbody>
        </table>
        <div v-if="sortedLoanLogs.length === 0" class="text-center py-6 text-gray-400">指定範圍內無紀錄</div>
    </div>
</div>
